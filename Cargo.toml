[workspace]
members = [
    "meterforge-core",
    "meterforge-ui",  # 启用 UI 开发
]
default-members = ["meterforge-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Meter Engine Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 共享依赖版本
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"

# GPUI 相关
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }

# gpui-component 组件库
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# 报文解析：完整帧解析（链路层 + 应用层），内部经 spec-engine 解析数据项内容
# 来自独立仓库 protocol-parser；git 依赖必须写仓库根 URL，
# cargo 会按包名 dlt645-2007 在仓库内自动定位，全新 clone / CI 无需本地兄弟目录
dlt645-2007 = { git = "https://github.com/zerojacks/protocol-parser.git" }

sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "json", "chrono", "migrate"] }
