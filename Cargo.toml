[workspace]
members = [
    "meter-core",
    "meter-ui",  # 启用 UI 开发
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Meter Engine Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 共享依赖版本
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"

# GPUI 相关
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }

# gpui-component 组件库
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# spec-engine integration (假设在同级目录)
# spec-engine = { path = "../spec-engine/spec-engine" }

